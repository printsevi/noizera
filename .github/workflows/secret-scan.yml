name: Secret scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    # Weekly full-history sweep, so a leak introduced by a force-push is still caught.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # Full history — a leak is a leak wherever it sits in the graph.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

  tracked-secret-files:
    name: no secret files tracked
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Assert local settings files are not tracked
        run: |
          set -euo pipefail
          # These must never appear in the index — they hold real credentials.
          matches="$(git ls-files | grep -E 'appsettings(\..*)?\.Local\.json$|(^|/)secrets\.json$|\.(pfx|p12|key)$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Files that must never be tracked are present in the index:"
            echo "$matches"
            exit 1
          fi
          echo "OK — no local settings or key material tracked."
