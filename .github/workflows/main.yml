name: CI/CD Main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REACT_IMAGE_NAME: "printsev/noizera:reactapp-latest"
  API_IMAGE_NAME: "printsev/noizera:api-latest"
  JOBS_IMAGE_NAME: "printsev/noizera:jobs-latest"
  DOTNET_ENV: "Production"
  
jobs:
  # build:
  #   runs-on: ubuntu-24.04
  #   steps:
  #   - uses: actions/checkout@v3

  #   - name: Build the Docker image
  #     run: docker-compose -f docker-compose.yml -f docker-compose.build.yml build --no-cache --force-rm 

  #   - name: Test the Docker image
  #     run: docker-compose -f docker-compose.yml up -d

  push_images:
    name: push images to docker hub
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from Dockerfile - reactapp
        id: extract_reactapp_version
        run: |
          version=$(grep -oP 'version="\K[^"]+' reactapp/Dockerfile)
          echo "REACTAPP_VERSION=$version" >> $GITHUB_ENV

      - name: Build and push - reactapp
        uses: docker/build-push-action@v4
        with:
          context: ./reactapp
          push: true
          tags: printsev/noizera:reactapp-latest,printsev/noizera:reactapp-${{ env.REACTAPP_VERSION }}
      
      - name: Extract version from Dockerfile - api
        id: extract_api_version
        run: |
          version=$(grep -oP 'version="\K[^"]+' api/Dockerfile)
          echo "API_VERSION=$version" >> $GITHUB_ENV

      - name: Build and push - api
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: printsev/noizera:api-latest,printsev/noizera:api-${{ env.API_VERSION }}

      - name: Extract version from Dockerfile - jobs
        id: extract_job_version
        run: |
          version=$(grep -oP 'version="\K[^"]+' background-jobs/Dockerfile)
          echo "JOBS_VERSION=$version" >> $GITHUB_ENV

      - name: Build and push - jobs
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./background-jobs/Dockerfile
          push: true
          tags: printsev/noizera:jobs-latest,printsev/noizera:jobs-${{ env.JOBS_VERSION }}

  deploy_noizera:
    name: Deploy Noizera
    runs-on: ubuntu-24.04
    needs: push_images
    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: copy file via ssh password
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          port: 22
          passphrase: ${{ secrets.PASSPHRASE }}
          source: "docker-compose.yml"
          target: ~/noizera/

      - name: deploy app to the droplet
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.DIGITALOCEAN_USERNAME }}
          key: ${{ secrets.SSHKEY }}
          port: 22
          passphrase: ${{ secrets.PASSPHRASE }}
          envs: REACT_IMAGE_NAME,API_IMAGE_NAME,JOBS_IMAGE_NAME,DOTNET_ENV,{{ secrets.NOIZERA_PROD_DB_CONNECTION }},{{ secrets.DIGITALOCEAN_ACCESS_TOKEN }},{{ secrets.DOCKERHUB_TOKEN }},{{ secrets.DOCKERHUB_USERNAME }},{{ secrets.PGADMIN_EMAIL }},{{ secrets.PGADMIN_PASSWORD }},{{ secrets.NOIZERA_PROD_API_JWT_SECRET }},{{ secrets.NOIZERA_PROD_API_JWT_ISSUER }},{{ secrets.NOIZERA_PROD_JWT_AUDIENCE }},{{ secrets.S3_SPACES_KEY }},{{ secrets.S3_SPACES_SECRET }},{{ secrets.BREVO_USERNAME }},{{ secrets.BREVO_PASSWORD }}
          script: |
            #!/bin/bash
            export REACT_IMAGE_NAME=$REACT_IMAGE_NAME
            export API_IMAGE_NAME=$API_IMAGE_NAME
            export JOBS_IMAGE_NAME=$JOBS_IMAGE_NAME
            export ASPNETCORE_ENVIRONMENT=$DOTNET_ENV
            export ConnectionStrings__PostgresConnection="${{ secrets.NOIZERA_PROD_DB_CONNECTION }}"
            export PGADMIN_DEFAULT_EMAIL=${{ secrets.PGADMIN_EMAIL }}
            export PGADMIN_DEFAULT_PASSWORD=${{ secrets.PGADMIN_PASSWORD }}
            export JwtSettings__Secret=${{ secrets.NOIZERA_PROD_API_JWT_SECRET }}
            export JwtSettings__Issuer=${{ secrets.NOIZERA_PROD_API_JWT_ISSUER }}
            export JwtSettings__Audience=${{ secrets.NOIZERA_PROD_JWT_AUDIENCE }}
            export S3__SpacesKey=${{ secrets.S3_SPACES_KEY }}
            export S3__SpacesSecret=${{ secrets.S3_SPACES_SECRET }}
            export EmailSettings__Username=${{ secrets.BREVO_USERNAME }}
            export EmailSettings__Password=${{ secrets.BREVO_PASSWORD }}
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            cd ~/noizera
            echo "Pulling latest images..."
            docker compose pull
            echo "Restarting services..."
            docker compose down
            docker compose up -d
            echo "Deployment completed!"
